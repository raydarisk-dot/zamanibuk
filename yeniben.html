  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // -------------------- SABİTLER --------------------

    const TASKS = [

    const CATEGORIES = {

      7:"Zihin",8:"Zihin",9:"Zihin",10:"Zihin",11:"Sağlık",12:"Sağlık",13:"Sağlık",
      14:"Sosyal",15:"Sosyal",16:"Sağlık",17:"Sağlık",18:"Bağımlılık",19:"Sağlık",
      20:"Hijyen",21:"Finans",22:"Finans",23:"Disiplin",24:"Disiplin",25:"Hijyen",
      26:"Hijyen",27:"Hijyen",28:"Hijyen",29:"Hijyen",30:"Hijyen",31:"Hijyen",
      32:"Bağımlılık",33:"Sağlık",34:"Hijyen",35:"Disiplin",36:"Dijital",
      37:"Bağımlılık",38:"Bağımlılık",39:"Bağımlılık",40:"Bağımlılık",41:"Hijyen",
      42:"Finans",43:"Sosyal",44:"Sosyal",45:"Sosyal",46:"Sosyal"
    };

    const PHASES = [
      {id:1,key:"ARINMA",title:"Faz I: ARINMA",desc:"Bağımlılıklardan arınma ve toksin detoksu.",start:1,end:7,newTasks:[40,39,37,38,36,18]},
      {id:2,key:"TEMEL",title:"Faz II: TEMEL DİSİPLİN",desc:"Yatağını topla, yüzünü yıka, işe git. Hayatın iskeleti.",start:8,end:21,newTasks:[34,28,20,33,41,42,17]},
      {id:3,key:"BEDEN",title:"Faz III: BEDENSEL UYANIŞ",desc:"Su, mekik, şınav, vitamin. Beden uyanıyor.",start:22,end:35,newTasks:[16,11,12,32,19]},
      {id:4,key:"ZIHIN",title:"Faz IV: ZİHİNSEL ODAK",desc:"Kitap, Python, Excel, Metalurji, İngilizce. Zihin keskinleşiyor.",start:36,end:49,newTasks:[5,6,7,8,9,10]},
      {id:5,key:"SOSYAL",title:"Faz V: SOSYAL DETOKS",desc:"Sessizlik, yorum yok, argo yok, planlarını anlatma.",start:50,end:63,newTasks:[1,14,15,43,44,45,46]},
      {id:6,key:"URETIM",title:"Faz VI: ÜRETKENLİK",desc:"Disiplin, erteleme yok, dua, planına sadık kal.",start:64,end:77,newTasks:[0,2,23,24,35]},
      {id:7,key:"GUC",title:"Faz VII: FİZİKSEL GÜÇ",desc:"Fitness / 3km koşu ve dayanıklılık inşası.",start:78,end:98,newTasks:[13,29]},
      {id:8,key:"RUH",title:"Faz VIII: RUH & DENGE",desc:"Bakım rutinleri, ev düzeni, iç denge.",start:99,end:119,newTasks:[25,26,27,30]},
      {id:9,key:"FINANS",title:"Faz IX: FİNANSAL KONTROL",desc:"İsrafı kes, evde ye, dışarıdan yeme.",start:120,end:140,newTasks:[3,4,31]},
      {id:10,key:"USTALIK",title:"Faz X: USTALIK",desc:"Para ve evin tam kontrolü, ustalık seviyesi.",start:141,end:161,newTasks:[21,22]},
      {id:11,key:"YENI",title:"Faz XI: YENİ HAYAT",desc:"Tüm sistem entegre, yeni kimlik kalıcı.",start:162,end:187,newTasks:[]}
    ];

    const MOTIVATIONS = ["Disiplin özgürlüktür.","Bugün yaptığın, yarın olacağın kişidir.","Zayıf anlar geçer, güçlü kararlar kalır.","Her gün %1 daha iyi ol.","Bahane yok, sadece sonuç var.","Sessiz kal, çok çalış, şaşırt.","Planına sadık kal, kendine karşı net ol."];
    const TRIGGER_TYPES = ["Stres","Can sıkıntısı","Sosyal ortam","Alışkanlık","Duygusal","Fiziksel yorgunluk","Tetikleyici ortam"];
    const SUBSTANCES = ["Sigara","Alkol","Kahve","Çay","Reel","Tatlı","Diğer"];
    const ACTIONS = ["Dayandım","Erteledim","Alternatif yaptım","İstek geçti","Yenik düştüm"];
    const ACHIEVEMENTS = [
      {id:"first",name:"İlk Adım",desc:"İlk görevi tamamla",icon:"🌱"},{id:"streak3",name:"3 Gün Seri",desc:"3 gün %50 üzeri",icon:"🔥"},
      {id:"streak7",name:"7 Gün Ateşi",desc:"7 gün streak",icon:"🔥"},{id:"streak30",name:"Ay Savaşçısı",desc:"30 gün streak",icon:"🏆"},
      {id:"xp1000",name:"Binlik",desc:"1000 XP topla",icon:"⭐"},{id:"xp5000",name:"Usta",desc:"5000 XP",icon:"💎"},
      {id:"phase1",name:"Arınma",desc:"Faz I tamamla",icon:"🧹"},{id:"phase5",name:"Sosyal Detoks",desc:"Faz V tamamla",icon:"🤫"},
      {id:"phase11",name:"Yeni Hayat",desc:"187 günü bitir",icon:"🚀"},{id:"smoke",name:"Dumansız",desc:"Sigarayı bırak 7 gün",icon:"🚬"},
      {id:"alcohol",name:"Ayık Kafa",desc:"Alkolü bırak 7 gün",icon:"🍺"},{id:"trigger10",name:"Gözlemci",desc:"10 tetikleyici kaydet",icon:"🧠"},
      {id:"resist90",name:"Çelik İrade",desc:"%90 dayanma oranı",icon:"🛡️"},{id:"education50",name:"Öğrenci",desc:"50 saat eğitim",icon:"📚"},
      {id:"finance",name:"Cimri Değil Tutumlu",desc:"30 gün finans takibi",icon:"💰"},{id:"mood30",name:"Duygu Ustası",desc:"30 gün ruh hali",icon:"😊"}
    ];
    const TABS = ["Dashboard","Görevler","Fazlar","İstatistik","Bağımlılık","Eğitim","Finans","Ruh Hali","Başarımlar","Hedefler","AI Koç"];

    // -------------------- YARDIMCI FONKSİYONLAR --------------------
    const getToday = () => new Date();
    const formatDate = (d) => d.toISOString().slice(0,10);
    const getDayNumber = (d = getToday()) => {
      if (d < START_DATE) return 0;
      const diff = Math.floor((d - START_DATE) / (1000*60*60*24)) + 1;
      return Math.min(Math.max(diff,1), TOTAL_DAYS);
    };
    const getRemaining = (d = getToday()) => Math.max(Math.ceil((END_DATE - d) / (1000*60*60*24)), 0);
    const getCurrentPhase = (day) => PHASES.find(p => day >= p.start && day <= p.end) || null;
    const getTasksForDay = (day) => {
      const phase = getCurrentPhase(day);
      if (!phase) return [];
      const all = [];
      for (const p of PHASES) {
        if (p.id <= phase.id) all.push(...p.newTasks);
      }
      return [...new Set(all)].sort((a,b)=>a-b);
    };
    const calcSuccess = (day, data, tasks) => {
      if (!data || !tasks.length) return 0;
      let sum = 0;
      tasks.forEach(id => sum += (data.completions?.[id] ?? 0));
      return Math.round(sum / tasks.length);
    };
    const calcXP = (day, data, tasks) => {
      if (!data || !tasks.length) return 0;
      let xp = 0;
      tasks.forEach(id => {
        const c = data.completions?.[id] ?? 0;
        const p = data.priorities?.[id] ?? 3;
        xp += p * 20 * (c/100);
      });
      const s = calcSuccess(day, data, tasks);
      if (s >= 100) xp += 150; else if (s >= 90) xp += 75; else if (s >= 75) xp += 30;
      return Math.round(xp);
    };
    const getStreak = (allData, today) => {
      let streak = 0;
      for (let i=1; i<=200; i++) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        if (d < START_DATE) break;
        const key = formatDate(d);
        const data = allData[key];
        if (!data) break;
        const day = getDayNumber(d);
        const tasks = getTasksForDay(day);
        if (calcSuccess(day, data, tasks) >= 50) streak++; else break;
      }
      return streak;
    };
    const getTotalXP = (allData, today) => {
      let total = 0;
      for (const key in allData) {
        const d = new Date(key);
        if (d < START_DATE || d > today) continue;
        const day = getDayNumber(d);
        const tasks = getTasksForDay(day);
        total += calcXP(day, allData[key], tasks);
      }
      return Math.round(total);
    };
    const getLevel = (xp) => Math.floor(xp / 1000) + 1;
    const getLast30 = (allData, today) => {
      const res = [];
      for (let i=29; i>=0; i--) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        if (d < START_DATE) { res.push(0); continue; }
        const key = formatDate(d);
        const data = allData[key];
        if (!data) { res.push(0); continue; }
        const day = getDayNumber(d);
        const tasks = getTasksForDay(day);
        res.push(calcSuccess(day, data, tasks));
      }
      return res;
    };
    const getLast7 = (allData, today) => {
      const res = [];
      for (let i=6; i>=0; i--) {
        const d = new Date(today); d.setDate(d.getDate() - i);
        if (d < START_DATE) { res.push(0); continue; }
        const key = formatDate(d);
        const data = allData[key];
        if (!data) { res.push(0); continue; }
        const day = getDayNumber(d);
        const tasks = getTasksForDay(day);
        res.push(calcSuccess(day, data, tasks));
      }
      return res;
    };
    const getAllDays = (allData, today) => {
      const res = [];
      for (let i=0; i<TOTAL_DAYS; i++) {
        const d = new Date(START_DATE); d.setDate(d.getDate() + i);
        if (d > today) { res.push(0); continue; }
        const key = formatDate(d);
        const data = allData[key];
        if (!data) { res.push(0); continue; }
        const day = i+1;
        const tasks = getTasksForDay(day);
        res.push(calcSuccess(day, data, tasks));
      }
      return res;
    };
    const calcSavings = (quit, today) => {
      const { smoking, alcohol } = quit;
      let sD=0, aD=0;
      if (smoking.quit && smoking.quitDate) sD = Math.max(0, Math.floor((today - new Date(smoking.quitDate)) / (1000*60*60*24)));
      if (alcohol.quit && alcohol.quitDate) aD = Math.max(0, Math.floor((today - new Date(alcohol.quitDate)) / (1000*60*60*24)));
      const sS = sD * smoking.price * smoking.perDay;
      const aS = aD * alcohol.price * alcohol.perDay;
      const p7 = (smoking.price * smoking.perDay + alcohol.price * alcohol.perDay) * 7;
      const p30 = (smoking.price * smoking.perDay + alcohol.price * alcohol.perDay) * 30;
      return { smokeDays:sD, alcDays:aD, smokeSaved:sS, alcSaved:aS, proj7:p7, proj30:p30 };
    };

    // -------------------- BİLEŞENLER --------------------
    const StatCard = ({ label, value, sub }) => (
      <div className="rounded-2xl bg-[#08080c] border border-[#1a1a2a] p-4 backdrop-blur">
        <div className="text-[10px] tracking-widest text-zinc-500 uppercase">{label}</div>
        <div className="text-[22px] font-black mt-1">{value}</div>
        <div className="text-[11px] text-zinc-500 mt-1">{sub}</div>
      </div>
    );

    const Dashboard = ({ isBeforeStart, day, dailySuccess, totalXP, level, streak, tasksForToday, currentPhase, tasks, todayData, motivation, openEmergency, emergencyLast, evaluations }) => (
      <div className="space-y-4">
        {isBeforeStart && <div className="rounded-2xl border border-amber-500/20 bg-gradient-to-r from-amber-500/10 to-transparent p-4 flex items-center gap-3"><div className="text-2xl">🚀</div><div className="text-[13px]"><span className="font-bold text-amber-300">Henüz Başlamadı</span> - 10.08.2026'da başlıyor</div></div>}
        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3">
          <StatCard label="Günlük Başarı" value={`%${dailySuccess}`} sub="bugün" />
          <StatCard label="XP Bugün" value={dailySuccess} sub={`Toplam ${totalXP}`} />
          <StatCard label="Seviye" value={level} sub={`${totalXP} XP`} />
          <StatCard label="Toplam Görev" value={47} sub="orijinal" />
          <StatCard label="Streak" value={streak} sub="gün" />
          <StatCard label="Kalan Gün" value={Math.max(187-day,0)} sub="/ 187" />
        </div>
        <div className="grid lg:grid-cols-3 gap-4">
          <div className="lg:col-span-2 space-y-4">
            <div className={`rounded-2xl border p-5 ${emergencyLast && (new Date() - new Date(emergencyLast)) < 7*24*60*60*1000 ? "bg-[#08080c] border-[#1a1a2a] opacity-60" : "bg-gradient-to-br from-red-950/40 to-[#08080c] border-red-900/40"}`}>
              <button disabled={emergencyLast && (new Date() - new Date(emergencyLast)) < 7*24*60*60*1000} onClick={openEmergency} className={`w-full h-[56px] rounded-xl font-black text-[14px] flex items-center justify-center gap-2 transition ${emergencyLast && (new Date() - new Date(emergencyLast)) < 7*24*60*60*1000 ? "bg-[#12131d] text-zinc-500" : "bg-red-600 hover:bg-red-500 text-white animate-pulse shadow-[0_0_20px_rgba(239,68,68,0.4)]"}`}>🚨 ACİL DURUM - ZAYIF AN</button>
              <div className="text-[11px] text-zinc-500 mt-2 text-center">{emergencyLast && (new Date() - new Date(emergencyLast)) < 7*24*60*60*1000 ? "Bu hafta hakkını kullandın - 7 günde 1 hak" : "Haftada 1 hak - Streak'ini korumak için kullan"}</div>
            </div>
            <div className="rounded-2xl bg-[#08080c] border border-[#1a1a2a] p-5">
              <div className="flex justify-between"><div className="text-[12px] tracking-widest text-zinc-500 uppercase">Bugünün Fazı</div>{currentPhase && <div className="text-[10px] px-2 py-1 rounded-full bg-amber-500/10 border border-amber-500/20 text-amber-300">AKTİF</div>}</div>
              <div className="mt-3">{currentPhase ? <><div className="font-black text-[18px]">{currentPhase.title}</div><div className="text-[13px] text-zinc-400 mt-1">{currentPhase.desc}</div><div className="mt-3 h-2 bg-[#12131d] rounded-full overflow-hidden"><div className="h-full bg-amber-400" style={{width:`${((day-currentPhase.start+1)/(currentPhase.end-currentPhase.start+1))*100}%`}} /></div><div className="text-[11px] text-zinc-500 mt-2">Gün {currentPhase.start} - {currentPhase.end} • {currentPhase.newTasks.length} yeni</div></> : <div className="text-emerald-400 font-bold">Tüm fazlar tamamlandı 🎉</div>}</div>
            </div>
            <div className="rounded-2xl bg-[#050508] border border-[#1a1a2a] p-5">
              <div className="text-[12px] tracking-widest text-zinc-500 uppercase">Son Değerlendirme</div>
              {evaluations.length === 0 ? <div className="text-[13px] text-zinc-500 mt-3">Henüz değerlendirme yok - 15 günde bir otomatik açılır</div> : <div className="mt-3 space-y-2"><div className="text-[13px]">Son: {evaluations[evaluations.length-1].date} - Gün {evaluations[evaluations.length-1].day}</div><div className="text-[12px] text-zinc-400 line-clamp-3">{evaluations[evaluations.length-1].answers.join(" | ")}</div></div>}
            </div>
          </div>
          <div className="space-y-4">
            <div className="rounded-2xl bg-[#08080c] border border-[#1a1a2a] p-5"><div className="text-[12px] tracking-widest text-zinc-500 uppercase">Motivasyon</div><div className="mt-4 text-[14px] font-medium leading-relaxed text-zinc-200">"{motivation}"</div><div className="mt-3 text-[11px] text-zinc-500">— Yeni Hayat OS</div></div>
            <div className="rounded-2xl bg-[#050508] border border-[#1a1a2a] p-5"><div className="text-[12px] tracking-widest text-zinc-500 uppercase">Bugün Aktif Görevler</div><div className="mt-3 space-y-2 max-h-[220px] overflow-auto pr-1">{tasksForToday.slice(0,8).map(id => <div key={id} className="flex items-center gap-2 text-[12px]"><div className={`w-4 h-4 rounded border flex items-center justify-center ${(todayData.completions?.[id] ?? 0) >= 100 ? "bg-amber-500 border-amber-500 text-black" : "border-[#2a2a3a]"}`}>{(todayData.completions?.[id] ?? 0) >= 100 ? "✓" : ""}</div><span className="truncate text-zinc-300">{TASKS[id]}</span></div>)}</div></div>
          </div>
        </div>
      </div>
    );

    const Tasks = ({ tasks, categories, phases, todayData, tasksForToday, isBeforeStart, searchTerm, setSearchTerm, categoryFilter, setCategoryFilter, phaseFilter, setPhaseFilter, setCompletion, setPriority, setDailyNote }) => {
      const filtered = tasks.map((t,i)=>({idx:i,text:t,cat:categories[i],phase:phases.find(p=>p.newTasks.includes(i))?.id||11})).filter(t=>{
        if(searchTerm && !t.text.toLowerCase().includes(searchTerm.toLowerCase())) return false;
        if(categoryFilter !== "Tümü" && t.cat !== categoryFilter) return false;
        if(phaseFilter !== "Tümü" && t.phase.toString() !== phaseFilter) return false;
        return true;
      });
      return <div className="space-y-4">
        <div className="flex flex-col md:flex-row gap-3">
          <input value={searchTerm} onChange={e=>setSearchTerm(e.target.value)} placeholder="Ara..." className="flex-1 h-10 rounded-xl bg-[#08080c] border border-[#1a1a2a] px-4 text-[13px] outline-none focus:border-amber-500/30" />
          <select value={categoryFilter} onChange={e=>setCategoryFilter(e.target.value)} className="h-10 rounded-xl bg-[#08080c] border border-[#1a1a2a] px-3 text-[13px]"><option>Tümü</option>{[...new Set(Object.values(categories))].map(c=><option key={c}>{c}</option>)}</select>
          <select value={phaseFilter} onChange={e=>setPhaseFilter(e.target.value)} className="h-10 rounded-xl bg-[#08080c] border border-[#1a1a2a] px-3 text-[13px]"><option value="Tümü">Tüm Fazlar</option>{phases.map(p=><option key={p.id} value={p.id}>{p.title}</option>)}</select>
        </div>
        <div className={`rounded-2xl border border-[#1a1a2a] bg-[#050508] overflow-hidden ${isBeforeStart ? "opacity-50 pointer-events-none relative" : ""}`}>
          {isBeforeStart && <div className="absolute inset-0 z-10 flex items-center justify-center bg-[#020205]/60 backdrop-blur-sm text-[13px] text-amber-300 font-medium">10.08.2026'da aktif olacak</div>}
          <div className="divide-y divide-[#12131d]">{filtered.map(({idx,text,cat}) => {
            const c = todayData.completions?.[idx] ?? 0;
            const p = todayData.priorities?.[idx] ?? 3;
            const active = tasksForToday.includes(idx) || isBeforeStart;
            return <div key={idx} className={`flex flex-col md:flex-row md:items-center gap-2 p-3 ${!active && !isBeforeStart ? "opacity-40" : ""}`}>
              <div className="flex items-center gap-3 flex-1"><button onClick={()=>setCompletion(idx, c>=100?0:100)} className={`w-5 h-5 rounded-md border flex items-center justify-center shrink-0 ${c>=100 ? "bg-amber-500 border-amber-500 text-black" : "border-[#2a2a3a] bg-[#12131d]"}`}>{c>=100 ? "✓" : ""}</button><span className="text-[13px] truncate flex-1">{text}</span><span className="text-[10px] px-2 py-0.5 rounded-full bg-[#12131d] border border-[#1a1a2a] text-zinc-400">{cat}</span></div>
              <div className="flex items-center gap-2"><div className="flex gap-0.5">{[1,2,3,4,5].map(v=><button key={v} onClick={()=>setPriority(idx,v)} className={`text-[14px] ${v<=p ? "text-amber-400" : "text-zinc-600"}`}>★</button>)}</div><div className="flex rounded-lg overflow-hidden border border-[#1a1a2a]">{[0,25,50,75,100].map(v=><button key={v} onClick={()=>setCompletion(idx,v)} className={`px-2 py-1 text-[11px] font-medium ${c===v ? "bg-amber-500 text-black" : "bg-[#12131d] text-zinc-400"}`}>{v}</button>)}</div></div>
            </div>
          })}</div>
          <div className="p-4 border-t border-[#1a1a2a]"><div className="text-[11px] text-zinc-500 uppercase tracking-widest mb-2">Günlük Not</div><textarea value={todayData.note || ""} onChange={e=>setDailyNote(e.target.value)} placeholder="Bugün neler oldu?" className="w-full min-h-[80px] rounded-xl bg-[#08080c] border border-[#1a1a2a] p-3 text-[13px] outline-none focus:border-amber-500/30" /></div>
        </div>
      </div>
    };

      const last30 = useMemo(() => getLast30(state.daily, today), [state.daily, today]);

      const allDays = useMemo(() => getAllDays(state.daily, today), [state.daily, today]);
      const avg30 = useMemo(() => { const v = last30.filter(x=>x>0); return v.length ? Math.round(v.reduce((a,b)=>a+b,0)/v.length) : 0; }, [last30]);
      const max30 = useMemo(() => Math.max(...last30, 0), [last30]);
      const min30 = useMemo(() => Math.min(...last30.filter(x=>x>0), 0) || 0, [last30]);
      const savings = useMemo(() => calcSavings(state.quit, today), [state.quit, today]);
      const evalAnswers = ["","","",""];

      const [searchTerm, setSearchTerm] = useState("");
      const [categoryFilter, setCategoryFilter] = useState("Tümü");
      const [phaseFilter, setPhaseFilter] = useState("Tümü");
      const [emergencyOpen, setEmergencyOpen] = useState(false);
      const [evaluationOpen, setEvaluationOpen] = useState(false);
      const [evalState, setEvalState] = useState(["","","",""]);
      const [breathActive, setBreathActive] = useState(false);
      const [breathTime, setBreathTime] = useState(60);
      const [breathPhase, setBreathPhase] = useState("inhale");
      const [checkItems, setCheckItems] = useState([false,false,false]);
      const [triggerNote, setTriggerNote] = useState("");
      const [newGoalText, setNewGoalText] = useState("");
      const [confetti, setConfetti] = useState(false);
      const [triggerForm, setTriggerForm] = useState({ intensity:5, type:TRIGGER_TYPES[0], substances:[], action:ACTIONS[0], note:"" });

      const setCompletion = (id, val) => setState(p => { const d = p.daily[todayKey] || { completions:{}, priorities:{}, note:"", education:{python:0,excel:0,metalurji:0,ingilizce:0}, finance:{spending:0,saving:0}, mood:{mood:3,energy:3,stress:3} }; return { ...p, daily:{ ...p.daily, [todayKey]:{ ...d, completions:{ ...d.completions, [id]:val } } } }; });
      const setPriority = (id, val) => setState(p => { const d = p.daily[todayKey] || { completions:{}, priorities:{}, note:"", education:{python:0,excel:0,metalurji:0,ingilizce:0}, finance:{spending:0,saving:0}, mood:{mood:3,energy:3,stress:3} }; return { ...p, daily:{ ...p.daily, [todayKey]:{ ...d, priorities:{ ...d.priorities, [id]:val } } } }; });
      const setDailyNote = (val) => setState(p => { const d = p.daily[todayKey] || { completions:{}, priorities:{}, note:"", education:{python:0,excel:0,metalurji:0,ingilizce:0}, finance:{spending:0,saving:0}, mood:{mood:3,energy:3,stress:3} }; return { ...p, daily:{ ...p.daily, [todayKey]:{ ...d, note:val } } }; });
      const setEducation = (f,v) => setState(p => { const d = p.daily[todayKey] || { completions:{}, priorities:{}, note:"", education:{python:0,excel:0,metalurji:0,ingilizce:0}, finance:{spending:0,saving:0}, mood:{mood:3,energy:3,stress:3} }; return { ...p, daily:{ ...p.daily, [todayKey]:{ ...d, education:{ ...d.education, [f]:v } } } }; });
      const setFinance = (f,v) => setState(p => { const d = p.daily[todayKey] || { completions:{}, priorities:{}, note:"", education:{python:0,excel:0,metalurji:0,ingilizce:0}, finance:{spending:0,saving:0}, mood:{mood:3,energy:3,stress:3} }; return { ...p, daily:{ ...p.daily, [todayKey]:{ ...d, finance:{ ...d.finance, [f]:v } } } }; });
      const setMood = (f,v) => setState(p => { const d = p.daily[todayKey] || { completions:{}, priorities:{}, note:"", education:{python:0,excel:0,metalurji:0,ingilizce:0}, finance:{spending:0,saving:0}, mood:{mood:3,energy:3,stress:3} }; return { ...p, daily:{ ...p.daily, [todayKey]:{ ...d, mood:{ ...d.mood, [f]:v } } } }; });
      const toggleQuit = (type) => setState(p => { const q = p.quit[type]; return { ...p, quit:{ ...p.quit, [type]:{ ...q, quit:!q.quit, quitDate:!q.quit ? new Date().toISOString() : null } } }; });
      const setQuitPrice = (type,v) => setState(p => ({ ...p, quit:{ ...p.quit, [type]:{ ...p.quit[type], price:v } } }));
      const setQuitPerDay = (type,v) => setState(p => ({ ...p, quit:{ ...p.quit, [type]:{ ...p.quit[type], perDay:v } } }));
      const handleAddTrigger = () => { setState(p => ({ ...p, triggers:[ { id:Date.now().toString(), date:new Date().toISOString(), intensity:triggerForm.intensity, type:triggerForm.type, substances:triggerForm.substances, action:triggerForm.action, note:triggerForm.note, resisted:triggerForm.action !== "Yenik düştüm" }, ...p.triggers ] })); setTriggerForm({ ...triggerForm, substances:[], note:"" }); };
      const addGoal = () => { if(!newGoalText.trim()) return; setState(p => ({ ...p, goals:[ ...p.goals, { id:Date.now().toString(), text:newGoalText, done:false } ] })); setNewGoalText(""); };
      const toggleGoal = (id) => setState(p => ({ ...p, goals:p.goals.map(g => g.id===id ? { ...g, done:!g.done } : g) }));
      const deleteGoal = (id) => setState(p => ({ ...p, goals:p.goals.filter(g => g.id !== id) }));
      const handleEmergency = () => { setState(p => ({ ...p, emergencyLast:new Date().toISOString() })); setEmergencyOpen(false); setBreathActive(false); setBreathTime(60); setCheckItems([false,false,false]); setTriggerNote(""); };
      const handleSaveEvaluation = () => { setState(p => ({ ...p, evaluations:[ ...p.evaluations, { date:todayKey, answers:evalState, day } ] })); setEvaluationOpen(false); setEvalState(["","","",""]); };

      useEffect(() => { if(isBeforeStart || day===0) return; if(day % 15 === 0) { const exists = state.evaluations.some(e => e.date === todayKey); if(!exists) { const t = setTimeout(() => setEvaluationOpen(true), 3000); return () => clearTimeout(t); } } }, [day, isBeforeStart]);
      useEffect(() => { if(isBeforeStart) return; const a = { ...state.achievements }; let c=false; if(totalXP>0 && !a.first){a.first=true;c=true;} if(streak>=3 && !a.streak3){a.streak3=true;c=true;} if(streak>=7 && !a.streak7){a.streak7=true;c=true;} if(streak>=30 && !a.streak30){a.streak30=true;c=true;} if(totalXP>=1000 && !a.xp1000){a.xp1000=true;c=true;} if(totalXP>=5000 && !a.xp5000){a.xp5000=true;c=true;} if(day>=7 && !a.phase1){a.phase1=true;c=true;} if(day>=63 && !a.phase5){a.phase5=true;c=true;} if(day>=187 && !a.phase11){a.phase11=true;c=true;} if(savings.smokeDays>=7 && !a.smoke){a.smoke=true;c=true;} if(savings.alcDays>=7 && !a.alcohol){a.alcohol=true;c=true;} if(state.triggers.length>=10 && !a.trigger10){a.trigger10=true;c=true;} const rr = state.triggers.length ? Math.round(state.triggers.filter(t=>t.resisted).length/state.triggers.length*100) : 0; if(rr>=90 && !a.resist90){a.resist90=true;c=true;} if(c) setState(p => ({ ...p, achievements:a })); }, [day, totalXP, streak, state.triggers, savings, state.achievements]);

      const renderTab = () => {
        switch(activeTab) {
          case "Dashboard": return <Dashboard isBeforeStart={isBeforeStart} day={day} dailySuccess={dailySuccess} totalXP={totalXP} level={level} streak={streak} tasksForToday={tasksForToday} currentPhase={currentPhase} tasks={TASKS} todayData={todayData} motivation={MOTIVATIONS[day % MOTIVATIONS.length]} openEmergency={()=>setEmergencyOpen(true)} emergencyLast={state.emergencyLast} evaluations={state.evaluations} />;
          case "Görevler": return <Tasks tasks={TASKS} categories={CATEGORIES} phases={PHASES} todayData={todayData} tasksForToday={tasksForToday} isBeforeStart={isBeforeStart} searchTerm={searchTerm} setSearchTerm={setSearchTerm} categoryFilter={categoryFilter} setCategoryFilter={setCategoryFilter} phaseFilter={phaseFilter} setPhaseFilter={setPhaseFilter} setCompletion={setCompletion} setPriority={setPriority} setDailyNote={setDailyNote} />;
          case "Fazlar": return <Phases phases={PHASES} tasks={TASKS} day={day} isBeforeStart={isBeforeStart} todayData={todayData} tasksForToday={tasksForToday} allDays={allDays} setConfetti={setConfetti} />;
          case "İstatistik": return <Statistics isBeforeStart={isBeforeStart} avg30={avg30} max30={max30} min30={min30} last7={last7} last30={last30} allDays={allDays} />;
          case "Bağımlılık": return <Addiction state={state} setState={setState} savings={savings} triggerForm={triggerForm} setTriggerForm={setTriggerForm} handleAddTrigger={handleAddTrigger} triggerTypes={TRIGGER_TYPES} substances={SUBSTANCES} actions={ACTIONS} toggleQuit={toggleQuit} setQuitPrice={setQuitPrice} setQuitPerDay={setQuitPerDay} today={today} openEmergency={()=>setEmergencyOpen(true)} />;
          case "Eğitim": return <Education isBeforeStart={isBeforeStart} todayData={todayData} setEducation={setEducation} />;
          case "Finans": return <Finance isBeforeStart={isBeforeStart} todayData={todayData} setFinance={setFinance} />;
          case "Ruh Hali": return <Mood isBeforeStart={isBeforeStart} todayData={todayData} setMood={setMood} />;
          case "Başarımlar": return <Achievements achievementsList={ACHIEVEMENTS} unlocked={state.achievements} />;
          case "Hedefler": return <Goals goals={state.goals} newGoalText={newGoalText} setNewGoalText={setNewGoalText} addGoal={addGoal} toggleGoal={toggleGoal} deleteGoal={deleteGoal} />;
          case "AI Koç": return <AICoach isBeforeStart={isBeforeStart} avg30={avg30} max30={max30} streak={streak} triggers={state.triggers} currentPhase={currentPhase} dailySuccess={dailySuccess} savings={savings} />;
          default: return null;
        }
      };

      return (
        <div className="min-h-screen bg-[#020205] text-zinc-100">
          {/* HEADER */}
          <header className="fixed top-0 left-0 right-0 z-50 bg-[#050508]/80 backdrop-blur-xl border-b border-[#1a1a2a]">
            <div className="max-w-[1600px] mx-auto px-3 md:px-6 h-[72px] flex items-center justify-between gap-2">
              <div className="flex items-center gap-2"><div className="w-8 h-8 md:w-9 md:h-9 rounded-xl bg-amber-500/10 border border-amber-500/20 flex items-center justify-center text-amber-400 font-black text-[11px]">YH</div><div className="font-black tracking-[0.15em] text-[11px] md:text-[14px] text-amber-400 truncate">YENİ HAYAT OS</div>
                <div className="hidden md:flex items-center gap-2 ml-4"><div className="w-10 h-10 relative"><svg className="w-10 h-10 -rotate-90"><circle cx="20" cy="20" r="16" stroke="#1a1a2a" strokeWidth="3" fill="none" /><circle cx="20" cy="20" r="16" stroke="#fbbf24" strokeWidth="3" fill="none" strokeDasharray={`${2*Math.PI*16}`} strokeDashoffset={`${2*Math.PI*16*(1-(isBeforeStart?0:day/TOTAL_DAYS))}`} strokeLinecap="round" style={{filter:"drop-shadow(0 0 6px #fbbf24)"}} /></svg><span className="absolute inset-0 flex items-center justify-center text-[10px] font-bold">{isBeforeStart?0:Math.round(day/TOTAL_DAYS*100)}%</span></div><div><div className="text-[11px] leading-tight text-zinc-400">{isBeforeStart?"Gün 0 / 187 - Henüz Başlamadı":`Gün ${day} / 187`}</div><div className="text-[11px] leading-tight font-bold">{isBeforeStart?"Beklemede":`${dailySuccess}% bugün`}</div></div></div>
              </div>
              <div className="flex items-center gap-2 text-right">{isBeforeStart ? <div><div className="text-[10px] text-zinc-500 uppercase tracking-widest">Başlangıca Kalan</div><div className="text-amber-400 font-black text-[12px] md:text-[18px]">{Math.ceil((START_DATE-today)/(1000*60*60*24))}g</div></div> : <div><div className="text-[10px] text-zinc-500 uppercase tracking-widest">Bitişe Kalan</div><div className="text-emerald-400 font-black text-[14px] md:text-[22px] drop-shadow-[0_0_10px_rgba(52,211,153,0.5)]">{getRemaining(today)}g</div></div>}</div>
            </div>
          </header>

          {/* NAV */}
          <nav className="fixed top-[72px] left-0 right-0 z-40 bg-[#08080c]/90 backdrop-blur-xl border-b border-[#1a1a2a] overflow-hidden">
            <div className="max-w-[1600px] mx-auto px-2 md:px-6 flex gap-1 md:gap-2 h-[44px] items-center overflow-x-auto" style={{scrollbarWidth:"none"}}>
              {TABS.map(tab => <button key={tab} onClick={()=>setActiveTab(tab)} className={`whitespace-nowrap px-3 md:px-4 h-[32px] rounded-full text-[12px] md:text-[13px] font-medium transition-all border shrink-0 ${activeTab===tab ? "bg-amber-500/10 border-amber-500/30 text-amber-300 shadow-[0_0_12px_rgba(251,191,36,0.25)]" : "bg-[#12131d] border-[#1a1a2a] text-zinc-400 hover:text-zinc-200"}`}>{tab}{activeTab===tab && <span className="ml-2 inline-block w-1 h-1 rounded-full bg-amber-400 shadow-[0_0_6px_#fbbf24]" />}</button>)}
            </div>
          </nav>

          {/* MAIN */}
          <main className="pt-[124px] pb-[90px] md:pb-6 max-w-[1600px] mx-auto px-3 md:px-6 overflow-x-hidden">
            {renderTab()}
          </main>

          {/* MODALS */}
          <EmergencyModal isOpen={emergencyOpen} onClose={()=>setEmergencyOpen(false)} onEmergency={handleEmergency} breathActive={breathActive} setBreathActive={setBreathActive} breathTime={breathTime} setBreathTime={setBreathTime} setBreathPhase={setBreathPhase} checkItems={checkItems} setCheckItems={setCheckItems} triggerNote={triggerNote} setTriggerNote={setTriggerNote} />
          {evaluationOpen && <div className="fixed inset-0 z-[80] bg-black/70 backdrop-blur-md flex items-center justify-center p-4"><div className="w-full max-w-[640px] rounded-2xl bg-[#08080c] border border-[#1a1a2a] p-6 max-h-[90vh] overflow-auto"><div className="flex justify-between"><div className="font-black text-[15px]">15 Günlük Değerlendirme - Gün {day}</div><button onClick={()=>setEvaluationOpen(false)} className="w-8 h-8 rounded-full bg-[#12131d] border border-[#1a1a2a]">✕</button></div><div className="grid grid-cols-3 gap-3 mt-4"><div className="rounded-xl bg-[#050508] border border-[#1a1a2a] p-3 text-center"><div className="text-[11px] text-zinc-500">Ort. Başarı</div><div className="text-[18px] font-black mt-1">%{avg30}</div></div><div className="rounded-xl bg-[#050508] border border-[#1a1a2a] p-3 text-center"><div className="text-[11px] text-zinc-500">En İyi</div><div className="text-[18px] font-black mt-1 text-emerald-400">%{max30}</div></div><div className="rounded-xl bg-[#050508] border border-[#1a1a2a] p-3 text-center"><div className="text-[11px] text-zinc-500">Streak</div><div className="text-[18px] font-black mt-1">{streak}g</div></div></div><div className="mt-5 space-y-4">{["Son 15 günde en iyi ne yaptın?","En zor neydi?","Neyi geliştirmelisin?","Gelecek 15 gün hedeflerin?"].map((q,i)=><div key={i}><div className="text-[12px] font-medium">{q}</div><textarea value={evalState[i]} onChange={e=>{const n=[...evalState]; n[i]=e.target.value; setEvalState(n);}} className="mt-2 w-full min-h-[70px] rounded-xl bg-[#050508] border border-[#1a1a2a] p-3 text-[12px]" /></div>)}</div><div className="mt-5 flex gap-3"><button onClick={handleSaveEvaluation} className="flex-1 h-11 rounded-xl bg-amber-500 text-black font-bold text-[13px]">Kaydet</button><button onClick={()=>setEvaluationOpen(false)} className="h-11 px-5 rounded-xl bg-[#12131d] border border-[#1a1a2a] text-[13px]">Sonra Hatırlat</button></div></div></div>}
          {confetti && <div className="fixed inset-0 pointer-events-none z-[100] overflow-hidden">{Array.from({length:50}).map((_,i)=><div key={i} className="absolute animate-[fall_3s_ease-in_forwards]" style={{left:`${Math.random()*100}%`,top:"-10px",background:`hsl(${Math.random()*60+30},100%,50%)`,width:"8px",height:"12px",transform:`rotate(${Math.random()*360}deg)`,animationDelay:`${Math.random()*0.5}s`}} />)}</div>}
        </div>
      );
    };

    // Render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
