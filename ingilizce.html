<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3000 En Sık İngilizce Kelime</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=DM+Sans:wght@300;400;500;600&display=swap');

  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --border: #2a2a2a;
    --accent: #e8ff47;
    --accent2: #47ffe8;
    --text: #f0f0f0;
    --muted: #888;
    --card: #1c1c1c;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
  }

  header {
    padding: 32px 24px 16px;
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    background: var(--bg);
    z-index: 100;
  }

  .header-top {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 16px;
  }

  h1 {
    font-family: 'Space Mono', monospace;
    font-size: clamp(18px, 4vw, 28px);
    color: var(--accent);
    letter-spacing: -1px;
  }

  .count-badge {
    font-family: 'Space Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    background: var(--surface);
    padding: 2px 8px;
    border: 1px solid var(--border);
  }

  .controls {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    align-items: center;
  }

  input[type="text"] {
    flex: 1;
    min-width: 200px;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    transition: border-color 0.2s;
  }

  input[type="text"]:focus { border-color: var(--accent); }
  input[type="text"]::placeholder { color: var(--muted); }

  select {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 10px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    outline: none;
    cursor: pointer;
  }

  .stats {
    font-size: 12px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
    padding: 8px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  .stats span { color: var(--accent); }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 1px;
    background: var(--border);
    padding: 1px;
  }

  .word-card {
    background: var(--card);
    padding: 14px 16px;
    cursor: pointer;
    transition: background 0.15s;
    display: flex;
    flex-direction: column;
    gap: 4px;
    position: relative;
  }

  .word-card:hover { background: #232323; }
  .word-card:hover .num { color: var(--accent); }

  .num {
    font-family: 'Space Mono', monospace;
    font-size: 10px;
    color: #444;
    transition: color 0.15s;
  }

  .en {
    font-weight: 600;
    font-size: 15px;
    color: var(--text);
    letter-spacing: 0.2px;
  }

  .tr {
    font-size: 13px;
    color: var(--accent2);
    font-weight: 300;
  }

  .pos {
    font-size: 10px;
    color: #555;
    font-family: 'Space Mono', monospace;
    text-transform: uppercase;
    margin-top: 2px;
  }

  .no-results {
    grid-column: 1/-1;
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: 'Space Mono', monospace;
  }

  .no-results .big { font-size: 48px; margin-bottom: 12px; }

  /* Category filter pills */
  .pills {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
    padding: 10px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg);
  }

  .pill {
    font-size: 11px;
    font-family: 'Space Mono', monospace;
    padding: 4px 10px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: all 0.15s;
    color: var(--muted);
    background: none;
    text-transform: uppercase;
  }

  .pill:hover, .pill.active {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
  }

  .container { max-width: 1600px; margin: 0 auto; }
</style>
</head>

<div class="container">

const posLabels = {
  "n": "isim", "v": "fiil", "adj": "sıfat", "adv": "zarf",
  "prep": "edat", "conj": "bağlaç", "pron": "zamir",
  "det": "belirteç", "aux": "yardımcı", "num": "sayı"
};

const posColors = {
  "n": "#47ffe8", "v": "#e8ff47", "adj": "#ff9147", "adv": "#d147ff",
  "prep": "#47a1ff", "conj": "#ff4747", "pron": "#47ff91", "det": "#ffd147",
  "aux": "#ff47c8", "num": "#c8ff47"
};

let filtered = [...words];
let activePOS = "";

function render(data) {
  const grid = document.getElementById('grid');
  if (data.length === 0) {
    grid.innerHTML = '<div class="no-results"><div class="big">🔍</div>Sonuç bulunamadı</div>';
    return;
  }
  grid.innerHTML = data.map(([num, en, tr, pos]) => `
    <div class="word-card">
      <span class="num">#${num}</span>
      <span class="en">${en}</span>
      <span class="tr">${tr}</span>
      <span class="pos" style="color:${posColors[pos] || '#555'}">${posLabels[pos] || pos}</span>
    </div>
  `).join('');
  document.getElementById('shownCount').textContent = data.length;
}

function applyFilters() {
  const q = document.getElementById('search').value.toLowerCase().trim();
  const pos = document.getElementById('posFilter').value;
  filtered = words.filter(([num, en, tr, p]) => {
    const matchQ = !q || en.includes(q) || tr.includes(q);
    const matchPOS = !pos || p === pos;
    const matchActive = !activePOS || p === activePOS;
    return matchQ && matchPOS && matchActive;
  });
  render(filtered);
}

// Build POS pills
const posTypes = [...new Set(words.map(w => w[3]))];
const pillContainer = document.getElementById('pillContainer');
const allPill = document.createElement('button');
allPill.className = 'pill active';
allPill.textContent = 'HEPSI';
allPill.onclick = () => {
  activePOS = "";
  document.querySelectorAll('.pill').forEach(p => p.classList.remove('active'));
  allPill.classList.add('active');
  applyFilters();
};
pillContainer.appendChild(allPill);

posTypes.forEach(p => {
  const btn = document.createElement('button');
  btn.className = 'pill';
  btn.style.borderColor = posColors[p] || '#2a2a2a';
  btn.textContent = (posLabels[p] || p).toUpperCase();
  btn.onclick = () => {
    activePOS = p;
    document.querySelectorAll('.pill').forEach(pb => pb.classList.remove('active'));
    btn.classList.add('active');
    applyFilters();
  };
  pillContainer.appendChild(btn);
});

document.getElementById('search').addEventListener('input', applyFilters);
document.getElementById('posFilter').addEventListener('change', applyFilters);

render(words);
