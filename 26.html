        .orb-violet { animation: floatSlow 11s ease-in-out infinite reverse, breath 5s ease-in-out infinite; }
        .orb-pink { animation: floatSlow 10s ease-in-out infinite, breath 6s ease-in-out infinite; }
        .orb-emerald { animation: floatSlow 12s ease-in-out infinite reverse, breath 5.5s ease-in-out infinite; }
        .orb-center { animation: breath 7s ease-in-out infinite; }

        .ring-pulse { animation: ringPulse 1s ease-out forwards; }
        @keyframes ringPulse { 0%{transform:scale(0.9); opacity:0.8;} 100%{transform:scale(1.35); opacity:0;} }
        /* Anka */
        .mystery-silhouette-group { transform-origin: 32px 32px; animation: mysteryPulse 3.2s ease-in-out infinite; }
        .mystery-halo { transform-origin: 32px 32px; animation: haloBreath 2.8s ease-in-out infinite; }
        .mystery-halo-outer { transform-origin: 32px 32px; animation: haloBreathOuter 3.6s ease-in-out infinite; }
        .myst-red-core { transform-origin: 32px 28.5px; animation: redCorePulse 2s ease-in-out infinite; }
        .myst-red-inner { animation: redInnerFlicker 1.4s ease-in-out infinite; }
        .myst-blue-edge { animation: blueEdgeShift 3s ease-in-out infinite; }
        .myst-trail { animation: trailSway 2.4s ease-in-out infinite; }
        .myst-trail.t2 { animation-delay: 0.2s; animation-duration: 2.8s; }
        .myst-trail.t3 { animation-delay: 0.4s; animation-duration: 3.2s; }
        .myst-eye { animation: eyeColorShift 2.2s ease-in-out infinite; }
        .myst-eye.eye-left { animation-delay: 0s; }
        .myst-eye.eye-right { animation-delay: 0.35s; }
        .myst-eye-glow { animation: eyeGlowPulseMyst 2.2s ease-in-out infinite; }
        .myst-eye-glow.eg2 { animation-delay: 0.35s; }
        .myst-mist-dot { animation: mistFloat 3.5s ease-in-out infinite; }
        .myst-mist-dot.d1 { animation-duration: 3.2s; }
        .myst-mist-dot.d2 { animation-duration: 4s; animation-delay: 0.4s; }
        .myst-mist-dot.d3 { animation-duration: 3.6s; animation-delay: 0.2s; }
        .myst-mist-dot.d4 { animation-duration: 3.8s; animation-delay: 0.6s; }
        .myst-mist-dot.d5 { animation-duration: 3s; animation-delay: 0.3s; }
        .myst-mist-dot.d6 { animation-duration: 4.2s; animation-delay: 0.8s; }
        .myst-mist-dot.d7 { animation-duration: 3.4s; animation-delay: 0.5s; }
        .phx-active-mystery .mystery-halo { animation: haloBreathActive 1.2s ease-in-out infinite; filter: drop-shadow(0 0 18px #9d00ff) drop-shadow(0 0 30px #9d00ff); }
        .phx-active-mystery .mystery-halo-outer { animation: haloBreathOuterActive 1.4s ease-in-out infinite; opacity: 0.32 !important; }
        .phx-active-mystery .mystery-silhouette-group { animation: mysteryPulseActive 1.6s ease-in-out infinite; }
        .phx-active-mystery .myst-red-core { animation: redCorePulseActive 0.9s ease-in-out infinite; }
        @keyframes mysteryPulse { 0% { filter: hue-rotate(0deg) brightness(1) drop-shadow(0 0 6px rgba(255,0,60,0.7)) drop-shadow(0 0 14px rgba(157,0,255,0.5)); } 50% { filter: hue-rotate(-38deg) brightness(1.15) drop-shadow(0 0 9px rgba(0,212,255,0.8)) drop-shadow(0 0 18px rgba(157,0,255,0.7)); } 100% { filter: hue-rotate(0deg) brightness(1) drop-shadow(0 0 6px rgba(255,0,60,0.7)) drop-shadow(0 0 14px rgba(157,0,255,0.5)); } }
        @keyframes mysteryPulseActive { 0% { filter: hue-rotate(0deg) brightness(1.15) drop-shadow(0 0 10px rgba(255,0,60,0.9)) drop-shadow(0 0 22px rgba(157,0,255,0.7)); } 50% { filter: hue-rotate(-42deg) brightness(1.32) drop-shadow(0 0 14px rgba(0,212,255,1)) drop-shadow(0 0 28px rgba(157,0,255,0.9)); } 100% { filter: hue-rotate(0deg) brightness(1.15) drop-shadow(0 0 10px rgba(255,0,60,0.9)) drop-shadow(0 0 22px rgba(157,0,255,0.7)); } }
        @keyframes haloBreath { 0%,100% { transform: scale(1); opacity: 0.20; } 50% { transform: scale(1.15); opacity: 0.30; } }
        @keyframes haloBreathOuter { 0%,100% { transform: scale(1.2); opacity: 0.08; } 50% { transform: scale(1.45); opacity: 0.14; } }
        @keyframes haloBreathActive { 0%,100% { transform: scale(1.6); opacity: 0.28; } 50% { transform: scale(2.05); opacity: 0.42; } }
        @keyframes haloBreathOuterActive { 0%,100% { transform: scale(2.0); opacity: 0.12; } 50% { transform: scale(2.6); opacity: 0.22; } }
